<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Capture Agent</title>
    <script>
      // Applied synchronously (before CSS/first paint) so opening this page as a
      // full-tab dashboard (?mode=dashboard) doesn't flash the docked layout first.
      if (new URLSearchParams(location.search).get("mode") === "dashboard") {
        document.documentElement.classList.add("dashboard-mode");
      }
    </script>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <nav id="dashboard-sidebar" class="dashboard-sidebar" role="tablist" aria-label="Dashboard sections"></nav>
      <div class="app">
      <header class="topbar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
            <path
              d="M13.6 12.2a6 6 0 1 0-1.4 1.4l3.9 3.9 1.4-1.4-3.9-3.9ZM8 12.5A4.5 4.5 0 1 1 8 3.5a4.5 4.5 0 0 1 0 9Z"
              fill="currentColor"
            />
          </svg>
          <input
            id="search-input"
            class="search-input"
            type="text"
            placeholder="Search captures…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button
          id="sort-match-btn"
          type="button"
          class="sort-toggle"
          aria-pressed="false"
          title="Sort captures by resume match score"
        >
          Sort by Best Match
        </button>
        <button
          id="digest-btn"
          type="button"
          class="sort-toggle"
          title="Generate a ranked, newspaper-styled digest of your captures"
        >
          📰 Today's Edition
        </button>
      </header>

      <section id="funnel-stats" class="funnel-stats" aria-label="Capture funnel stats">
        <div class="stat">
          <span id="stat-captures" class="stat-value">0</span>
          <span class="stat-label">Total Jobs Captured</span>
        </div>
        <div class="stat">
          <span id="stat-rate" class="stat-value">0%</span>
          <span class="stat-label">Conversion Rate</span>
        </div>
      </section>

      <nav id="view-tabs" class="view-tabs" role="tablist" aria-label="View">
        <button id="view-tab-list" type="button" class="view-tab" role="tab" aria-selected="true">List</button>
        <button id="view-tab-overview" type="button" class="view-tab" role="tab" aria-selected="false">Overview</button>
      </nav>

      <nav id="platform-tabs" class="tabs" role="tablist" aria-label="Capture platforms"></nav>

      <nav id="tabs" class="tabs" role="tablist" aria-label="Capture categories"></nav>

      <main id="list" class="list" role="tabpanel" aria-live="polite"></main>

      <button id="load-more-btn" type="button" class="load-more-btn" hidden>Load More</button>

      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title">Nothing here yet</p>
        <p class="empty-sub">Captures from X.com will show up in this panel.</p>
      </div>

      <section id="overview-view" class="overview" role="tabpanel" hidden>
        <div id="overview-empty" class="empty-state" hidden>
          <p class="empty-title">Nothing captured yet</p>
          <p class="empty-sub">Stats will show up here once you capture something.</p>
        </div>
        <div id="overview-content" hidden>
          <p id="overview-total" class="overview-total"></p>

          <div class="overview-block">
            <h3 class="overview-heading">By Platform</h3>
            <div id="overview-platform-bars" class="bar-list"></div>
          </div>

          <div class="overview-block">
            <h3 class="overview-heading">By Category</h3>
            <div id="overview-category-bars" class="bar-list"></div>
          </div>

          <div class="overview-block">
            <div class="overview-heading-row">
              <h3 class="overview-heading">Capture Trend</h3>
              <span id="overview-trend-range" class="overview-trend-range"></span>
            </div>
            <div id="overview-trend" class="trend-chart" aria-label="Captures per day, last 30 days"></div>
          </div>
        </div>
      </section>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
